name: Reusable Callee
on:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  reusable_job:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token from reusable workflow context
        run: |
          set -eu
          TOKEN=$(curl -sS \
            -H "Accept: application/json; api-version=2.0" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=test-aud-reusable" | jq -r '.value')
          PAYLOAD_B64=$(echo "$TOKEN" | cut -d. -f2)
          # Add padding
          PADDED="$PAYLOAD_B64"
          MOD=$(( ${#PADDED} % 4 ))
          if [ $MOD -gt 0 ]; then
            PADDED="$PADDED$(printf '%.0s=' $(seq $((4-MOD))))"
          fi
          PAYLOAD_JSON=$(echo "$PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null)
          echo "===== OIDC PAYLOAD KEYS ====="
          echo "$PAYLOAD_JSON" | jq -r 'keys[]' | sort
          echo ""
          echo "===== Filtered: repo_property_* + key context ====="
          echo "$PAYLOAD_JSON" | jq '{
            sub, repository, repository_owner, repository_id,
            workflow, workflow_ref, workflow_sha,
            job_workflow_ref, job_workflow_sha,
            event_name, ref, head_ref, base_ref,
            repo_props: with_entries(select(.key | startswith("repo_property_")))
          }'
          echo ""
          echo "===== Native sub vs custom: ====="
          echo "sub=$(echo "$PAYLOAD_JSON" | jq -r .sub)"
          echo "job_workflow_ref=$(echo "$PAYLOAD_JSON" | jq -r .job_workflow_ref)"
          echo "workflow_ref=$(echo "$PAYLOAD_JSON" | jq -r .workflow_ref)"
